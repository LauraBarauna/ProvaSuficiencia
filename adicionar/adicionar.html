<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adicionar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <title>Document</title>
</head>

<body>
    <header>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="/adicionar/adicionar.html" id="inserir">Inserir</a></li>
                <li><a href="/listar/listar.html">Listar</a></li>
                <li><a href="/js/">Alterar</a></li>
                <li><a href="/deletar/deletar.html">Excluir</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Cadastrar Colaborador</h1>

            <form id="myForm">
                <fieldset>
                    <div class="div-input">
                        <label for="nomeInput">Nome *</label>
                        <input type="text" id="nomeInput" name="nome" placeholder="Ex: Laura" required>
                    </div>

                    <div class="div-input">
                        <label for="salarioInput">Salário *</label>
                        <input type="number" id="salarioInput" name="salario" placeholder="Ex: 1500" min="0" step="0.01"
                            required>
                    </div>

                    <div class="div-input">
                        <label for="idadeInput">Idade *</label>
                        <input type="number" id="idadeInput" name="idade" placeholder="Ex: 20" min="0" required>
                    </div>

                </fieldset>

                <button type="submit">Adicionar</button>
            </form>
        </section>
    </main>

    <div id="modalErro" class="modal hidden">
        <div class="modal-content">
            <p>Colaborador cadastrado!</p>
            <button id="fecharModal">OK</button>
        </div>
    </div>

    <script src="adicionar.js"></script>
</body>

</html>
